<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Scheduling</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Hospital Appointment Management System</h1>
    <p>Appointment Scheduling</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="patients.html">Patients</a>
    <a href="doctors.html">Doctors</a>
    <a href="appointments.html">Appointments</a>
    <a href="history.html">History</a>
</nav>

<section>

    <h2>Schedule Appointment</h2>

    <form>

        <label>Patient Name:</label>
        <input type="text" placeholder="Enter Patient Name">

        <label>Doctor:</label>

        <select>
            <option>Select Doctor</option>
            <option>Dr. Ravi Kumar</option>
            <option>Dr. Priya Sharma</option>
            <option>Dr. Arjun Reddy</option>
        </select>

        <label>Appointment Date:</label>
        <input type="date">

        <label>Appointment Time:</label>
        <input type="time">

        <label>Reason for Visit:</label>
        <textarea placeholder="Enter reason for visit"></textarea>

        <button type="submit">
            Schedule Appointment
        </button>

    </form>

    <p class="success">
        Appointment can be confirmed after selecting
        the patient, doctor, date and time.
    </p>

</section>

<footer>
    <p>© 2026 Hospital Appointment Management System</p>
</footer>

</body>
</html>
